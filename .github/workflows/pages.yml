name: Website

# Publishes the static site in website/ to GitHub Pages. scripts/release.sh runs it after a release, so the
# Download buttons follow the newest disk image.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The Download buttons link to the releases page in the source; here they get the latest release's .dmg itself.
      - name: Point the Download buttons at the latest disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | select(.name | endswith(".dmg")) | .url' | head -n 1)
          echo "Latest disk image: ${url:-none}"
          if [ -n "$url" ]; then sed -i "s|https://github.com/$GITHUB_REPOSITORY/releases/latest\"|$url\"|g" website/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
